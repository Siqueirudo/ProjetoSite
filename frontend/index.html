<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <link rel="stylesheet" href="assets/styles/global/global.css"/>
    <link rel="stylesheet" href="assets/styles/pages/index/index.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
    <header id="header">
        <div class="navbar">
            <div class="menunav-button"><i class="fa-solid fa-bars"></i></div>
            
            <div class="logo"><img src="assets/images/logo/logo_synapse.png"/></div>

            <div class="cart_login">
                <a href=""><button class="purple_button">Fazer Login</button></a>

                <div class="menucart-button"><i class="fa-solid fa-cart-shopping"></i></div>
            </div><!--Cart-login-->
        </div><!--navbar-->
    </header>

    <section class="banner-slide">
        <div class="slider-controls">
            <div class="slider-control" onclick="back()"><i class="fa-solid fa-angle-left"></i></div>
            <div class="slider-control" onclick="next()"><i class="fa-solid fa-angle-right"></i></div>
        </div><!--Slider Controls-->
        <div class="slider">
            <div class="slider-image first">
                <div class="dark">
                    <div class="slider-content">
                        <h2>Honda</h2>
                        <h1>Reach Maximum <em>SPEED</em></h1>
                        <a href="#home"><button class="seemore-button">See more <i class="fa-solid fa-share"></i></button></a>
                    </div><!--Slider Content(1)-->
                </div>
            </div><!--First Slider-->
            <div class="slider-image second">
                <div class="dark">
                    <div class="slider-content">
                        <h2>Mitsubishi</h2>
                        <h1>Show your <em>AESTHETIC</em></h1>
                        <a href="#home"><button class="seemore-button">See more <i class="fa-solid fa-share"></i></button></a>
                    </div><!--Slider Content(2)-->
                </div>
            </div><!--Second Slider-->
            <div class="slider-image third">
                <div class="dark">
                    <div class="slider-content">
                        <h2>Jeep</h2>
                        <h1>Claim your <em>POWER</em></h1>
                        <a href="#home"><button class="seemore-button">See more <i class="fa-solid fa-share"></i></button></a>
                    </div><!--Slider Content(3)-->
                </div>
            </div><!--Third Slider-->
        </div><!--Slider-->
    </section><!--Banner Slide-->

</body>
</html>
