{% extends "base.html" %}
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <link rel="stylesheet" href="{% static 'styles\global\global.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/global/partials.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/index/index.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/login/login.css' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
    <main>
        <div class="login-container">
            <h2>Login</h2>
            <form method="post">
                {% csrf_token %}
                <div class="signin-side">
                    {{ login_form.username.errors }}
                    <label>Nome de usuário:</label>
                    {{ login_form.username }}
                </div>
                <div class="signin-side">
                    {{ login_form.password.errors }}
                    <label>Senha:</label>
                    {{ login_form.password }}
                </div>
                <div>
                    <input type="submit" value="Entrar">
                </div>
        </div>
    </main>

<script src="{% static 'scripts/index/banner.js' %}"></script>
<script src="{% static 'scripts/header/menuopener.js' %}"></script>
</body>
</html>
{% endblock %}
