{% extends "base.html" %}
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <link rel="stylesheet" href="{% static 'styles\global\global.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/global/partials.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/index/index.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/login/login.css' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
    <main>
        <div class="login-container">
            <h1>ENTRAR</h1>
            <form method="post">
                {% csrf_token %}
                
                    {{ login_form.username.errors }}
                    <label>Nome de usuário:<br/>
                    <input type="text" id="username" name="username" class="text-input"/>
                    
                    </label>
                
                
                    {{ login_form.password.errors }}
                    <label>Senha:<br/>
                    <input type="password" id="password" name="password" class="text-input"/>
                    </label>
                   
                
                    <label>
                    <input type="submit" class="purple_button" value="Entrar">
                    </label>

            </form>
            <p><a href="">Esqueci minha senha</a></p>
            <p>Ainda não possui uma conta? <a href="{% url 'register' %}">Cadastre-se!</a></p>
        </div>

    </main>

<script src="{% static 'scripts/index/banner.js' %}"></script>
<script src="{% static 'scripts/header/menuopener.js' %}"></script>
</body>
</html>
{% endblock %}
