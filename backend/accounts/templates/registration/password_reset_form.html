{% extends "base.html" %}
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <link rel="stylesheet" href="{% static 'styles\global\global.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/global/partials.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/index/index.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/login/login.css' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>

<main>
    <div class="login-container">
            <h1>RECUPERAÇÃO DE SENHA</h1>
            <p>Esqueceu sua senha? Digite seu endereço de e-mail no campo abaixo. Você irá receber um e-mail com instruções para criar uma nova senha.</p>
            
            <form method="post">
                {% csrf_token %}
                <label>
                    e-mail: <br/>
                    <input type="email" class="text-input" name="email" required/>
                </label>
                <input type="submit" class="purple_button" value="Enviar" />

            </form>
    </div><!--login-container-->
</main>

<script src="{% static 'scripts/index/banner.js' %}"></script>
<script src="{% static 'scripts/header/menuopener.js' %}"></script>
</body>
</html>
{% endblock %}
