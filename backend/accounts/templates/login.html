{% extends "base.html" %}
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <link rel="stylesheet" href="{% static 'styles\global\global.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/global/partials.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/index/index.css' %}"/>
    <link rel="stylesheet" href="{% static 'styles/pages/login/login.css' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
    <main>
        <div class="login-container">
            <h1>CADASTRE-SE</h1>
            <form  method="post">
                {% csrf_token %}
                <div class="signin-side">
                    {{user_form.username.errors}}
                    <label >Nome de usuário:</label>
                    {{user_form.username}}
                
                <div class="signin-side">
                    <label>Email:</label>
                    <input type="email" name="email" required> <!-- Campo adicional -->
                </div>
                <div class="signin-side">
                    {{user_form.password1.errors}}
                    <label>senha:</label>
                    {{user_form.password1}}
                </div>
                <div class="signin-side">
                    {{user_form.password2.errors}}
                    <label>confirma senha:</label>
                    {{user_form.password2}}
                </div>
                
                <div class="signin-side">
                    <input type="submit" value="Cadastrar">
                </div>
                

            </form>

            
        </div>
    </main>

<script src="{% static 'scripts/index/banner.js' %}"></script>
<script src="{% static 'scripts/header/menuopener.js' %}"></script>
</body>
</html>
{% endblock %}
