<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  {% load static %}
  <!-- Arquivos CSS -->
  <link rel="stylesheet" href="{% static 'styles/global/global.css' %}"/>
  <link rel="stylesheet" href="{% static 'styles/pages/index/index.css' %}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
  <header id="header">
    <div class="navbar">
        <div class="menunav-button"><i class="fa-solid fa-bars"></i></div>
        
        <div class="logo"><img src="{% static 'images/logo/logo_synapse.png' %}" alt="Logo Synapse"/></div>

        <div class="menucart-button"><i class="fa-solid fa-cart-shopping"></i></div>
    </div><!--navbar-->
</header>

<main>
  {% block content %}
  {% endblock %}
</main>

</body>
</html>
